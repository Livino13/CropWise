services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cropwise
      POSTGRES_USER: cropwise
      POSTGRES_PASSWORD: cropwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropwise"]
      interval: 5s
      retries: 5
    networks:
      - appnet

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://cropwise:cropwise@postgres:5432/cropwise
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-prod}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-flash-lite-latest}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
